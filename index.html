<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>홍대·신촌 3D 지도 (Three.js)</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #111;
            font-family: 'Malgun Gothic', sans-serif;
        }
        #info {
            position: absolute;
            top: 15px;
            left: 15px;
            color: white;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 14px;
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div id="info">마우스 드래그: 지도 회전 | 우클릭 드래그: 이동 | 휠: 확대/축소</div>

    <!-- Three.js 및 OrbitControls ESM 브라우저 임포트 -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // 1. 씬(Scene), 카메라(Camera), 렌더러(Renderer) 초기화
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0b0f19); // 밤 배경 느낌의 다크 테마

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 2000);
        camera.position.set(0, -350, 300); // 위에서 내려다보는 각도

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // 2. 카메라 컨트롤 (회전, 확대, 패닝)
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true; // 부드러운 관성 효과
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 - 0.05; // 바닥 밑으로 카메라가 내려가지 않도록 제한

        // 3. 조명 설정 (입체감을 살리기 위한 광원)
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.9);
        directionalLight.position.set(200, -200, 400);
        scene.add(directionalLight);

        // 4. 지도 텍스처 로드 및 3D 평면 메시 생성
        const textureLoader = new THREE.TextureLoader();
        
        // 주의: 실제 실행 시 스크린샷 이미지 파일명을 동일하게 맞추거나 경로를 수정해주세요.
        textureLoader.load('1791784490728.jpg', (mapTexture) => {
            mapTexture.colorSpace = THREE.SRGBColorSpace;

            // 가로세로 비율 조정 (이미지 원본 비율 반영, 예: 250 x 500 또는 정사각형 기반)
            const width = 300;
            const height = 600; 
            
            // 정밀한 굴곡(Displacement) 표현을 위해 세그먼트를 촘촘하게 분할 (128x128)
            const geometry = new THREE.PlaneGeometry(width, height, 128, 128);

            // 가상의 지형 높낮이 데이터(Displacement Map)를 생성하기 위한 캔버스 처리 예시
            // (이미지의 밝기 성분을 활용해 도로/건물 단차가 살짝 올라오도록 효과 부여 가능)
            
            const material = new THREE.MeshStandardMaterial({
                map: mapTexture,
                roughness: 0.4,
                metalness: 0.1,
                side: THREE.DoubleSide
            });

            const mapMesh = new THREE.Mesh(geometry, material);
            scene.add(mapMesh);

            // 지도 주변에 은은한 바닥 베이스 판 추가
            const baseGeometry = new THREE.PlaneGeometry(width * 1.2, height * 1.2);
            const baseMaterial = new THREE.MeshBasicMaterial({ color: 0x05070c });
            const baseMesh = new THREE.Mesh(baseGeometry, baseMaterial);
            baseMesh.position.z = -2; // 지도 아래에 배치
            scene.add(baseMesh);
        }, undefined, (error) => {
            console.error('이미지 로드 중 오류가 발생했습니다:', error);
        });

        // 5. 반응형 리사이즈 처리
        window.addEventListener('resize', onWindowResize);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // 6. 렌더링 루프
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
