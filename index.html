<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>서교동교회 사역장소신청</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
    }
    .scrollbar-thin::-webkit-scrollbar {
      height: 6px;
      width: 6px;
    }
    .scrollbar-thin::-webkit-scrollbar-track {
      background: #f1f5f9;
      border-radius: 4px;
    }
    .scrollbar-thin::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
    .scrollbar-thin::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
  </style>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen">

  <div class="max-w-[1600px] mx-auto px-3 py-5 md:px-6 md:py-8">
    <!-- 헤더 -->
    <header class="flex flex-col md:flex-row md:items-center md:justify-between pb-5 mb-5 border-b border-slate-200 gap-4">
      <div>
        <div class="flex items-center gap-2 mb-1">
          <span class="p-2 bg-indigo-600 text-white rounded-lg text-sm shadow-sm"><i class="fa-solid fa-church"></i></span>
          <h1 class="text-xl md:text-2xl font-bold tracking-tight text-slate-900">서교동교회 사역장소신청</h1>
          <span id="admin-badge" class="hidden px-2 py-0.5 text-xs font-semibold bg-rose-100 text-rose-700 rounded-full border border-rose-200 ml-1">
            <i class="fa-solid fa-shield-halved mr-1"></i>관리자 모드
          </span>
        </div>
        <p class="text-xs md:text-sm text-slate-500">날짜를 선택하고 원하는 시간대의 빈 칸을 클릭하여 사역 장소를 신청하세요.</p>
      </div>

      <div class="flex items-center justify-between md:justify-end gap-2 flex-wrap">
        <!-- 날짜 네비게이션 -->
        <div class="flex items-center gap-2 bg-white p-2 rounded-xl shadow-sm border border-slate-200">
          <button id="prev-date-btn" class="p-2 text-slate-600 hover:text-indigo-600 hover:bg-slate-100 rounded-lg transition disabled:opacity-30 disabled:hover:bg-transparent disabled:cursor-not-allowed" title="이전 날짜">
            <i class="fa-solid fa-chevron-left text-sm"></i>
          </button>
          <input type="date" id="current-date-input" class="font-semibold text-slate-700 bg-transparent border-0 focus:ring-0 cursor-pointer outline-none text-xs md:text-sm" />
          <button id="next-date-btn" class="p-2 text-slate-600 hover:text-indigo-600 hover:bg-slate-100 rounded-lg transition disabled:opacity-30 disabled:hover:bg-transparent disabled:cursor-not-allowed" title="다음 날짜">
            <i class="fa-solid fa-chevron-right text-sm"></i>
          </button>
          <button id="today-btn" class="px-2.5 py-1 md:px-3 md:py-1.5 text-xs font-semibold text-indigo-600 bg-indigo-50 hover:bg-indigo-100 rounded-lg transition ml-1">
            오늘
          </button>
        </div>

        <!-- 관리자 모드 토글 버튼 -->
        <div class="flex items-center">
          <button id="admin-toggle-btn" class="px-3 py-2 bg-white hover:bg-slate-100 text-slate-600 rounded-xl shadow-sm border border-slate-200 text-xs font-semibold flex items-center gap-1.5 transition">
            <i class="fa-solid fa-lock text-slate-400"></i>
            <span id="admin-btn-text">관리자 로그인</span>
          </button>
        </div>
      </div>
    </header>

    <!-- 범례 및 안내 -->
    <div class="flex items-center justify-between mb-3 flex-wrap gap-2 text-[11px] md:text-xs font-medium text-slate-600">
      <div class="flex items-center gap-3 md:gap-4">
        <span class="flex items-center gap-1.5">
          <span class="w-3 h-3 rounded bg-white border border-dashed border-slate-300"></span> 예약 가능
        </span>
        <span class="flex items-center gap-1.5">
          <span class="w-3 h-3 rounded bg-indigo-500 border border-indigo-600"></span> 예약 완료
        </span>
      </div>
      <div class="text-slate-400">
        * 1시간 단위 (07:00 ~ 22:00) / 총 15개 공간 / 예약 가능 기간: 오늘 ~ 6개월 후
      </div>
    </div>

    <!-- 타임테이블 컨테이너 -->
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
      <div class="overflow-x-auto scrollbar-thin">
        <table class="w-full border-collapse text-left">
          <thead>
            <tr class="bg-slate-100/90 border-b border-slate-200 text-xs font-semibold text-slate-600">
              <th class="p-2.5 md:p-3.5 w-[120px] md:w-72 min-w-[120px] md:min-w-[280px] sticky left-0 bg-slate-100 z-10 border-r border-slate-200 text-center md:text-left">
                공간 목록
              </th>
              <th id="time-header-row" class="p-0 font-normal"></th>
            </tr>
          </thead>
          <tbody id="schedule-body" class="divide-y divide-slate-100 text-sm">
            <!-- 렌더링 영역 -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- 관리자 로그인 모달 -->
  <div id="admin-login-modal" class="fixed inset-0 z-50 hidden bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-xl max-w-xs w-full overflow-hidden p-5 space-y-4">
      <div class="flex items-center justify-between border-b pb-3 border-slate-100">
        <h3 class="font-bold text-slate-800 text-sm flex items-center gap-1.5">
          <i class="fa-solid fa-shield-halved text-indigo-600"></i> 관리자 인증
        </h3>
        <button id="close-admin-login-btn" class="text-slate-400 hover:text-slate-600 text-base">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <form id="admin-login-form" class="space-y-3">
        <div>
          <label class="block font-medium text-slate-600 text-xs mb-1">관리자 마스터 비밀번호</label>
          <input type="password" id="admin-pwd-input" required placeholder="관리자 비밀번호 입력" class="w-full px-3 py-2 text-sm rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500" />
        </div>
        <button type="submit" class="w-full py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-medium text-xs shadow-sm transition">
          인증 확인
        </button>
      </form>
    </div>
  </div>

  <!-- 예약 신청 모달 -->
  <div id="booking-modal" class="fixed inset-0 z-50 hidden bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-xl max-w-md w-full overflow-hidden" id="modal-content">
      <div class="px-5 py-4 bg-slate-50 border-b border-slate-100 flex items-center justify-between">
        <h3 class="font-bold text-slate-800 text-base flex items-center gap-2">
          <i class="fa-regular fa-calendar-check text-indigo-600"></i> 사역장소 신청
        </h3>
        <button id="close-modal-btn" class="text-slate-400 hover:text-slate-600 text-lg transition">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <form id="booking-form" class="p-5 md:p-6 space-y-4 text-sm">
        <div>
          <label class="block font-medium text-slate-600 mb-1">신청 정보</label>
          <div class="p-3 bg-slate-100 rounded-xl space-y-1 text-xs text-slate-700">
            <div><span class="font-semibold text-slate-500">날짜:</span> <span id="modal-date-text"></span></div>
            <div><span class="font-semibold text-slate-500">장소:</span> <span id="modal-room-text" class="font-bold text-indigo-900"></span></div>
            <div><span class="font-semibold text-slate-500">시간:</span> <span id="modal-time-text"></span></div>
          </div>
        </div>

        <div>
          <label class="block font-medium text-slate-700 mb-1" for="group-name">소속 소그룹 / 부서명 <span class="text-rose-500">*</span></label>
          <input type="text" id="group-name" required placeholder="예: 청년부 찬양팀, 3교구 2구역" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition" />
        </div>

        <div>
          <label class="block font-medium text-slate-700 mb-1" for="applicant-name">신청자 이름 <span class="text-rose-500">*</span></label>
          <input type="text" id="applicant-name" required placeholder="예: 홍길동" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition" />
        </div>

        <div id="password-field-container">
          <label class="block font-medium text-slate-700 mb-1" for="password">예약 취소 비밀번호 (4자리) <span class="text-rose-500">*</span></label>
          <input type="password" id="password" required maxlength="4" placeholder="예: 1234" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition" />
          <p class="text-[11px] text-slate-400 mt-1">* 나중에 예약을 취소할 때 본인 확인용으로 사용됩니다.</p>
        </div>

        <div>
          <label class="block font-medium text-slate-700 mb-1" for="contact-info">연락처 / 특이사항 (선택)</label>
          <input type="text" id="contact-info" placeholder="예: 010-1234-5678 / 방송장비 사용" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition" />
        </div>

        <div class="flex gap-2 pt-2">
          <button type="button" id="cancel-booking-btn" class="flex-1 px-4 py-2.5 rounded-xl font-medium text-slate-600 bg-slate-100 hover:bg-slate-200 transition">취소</button>
          <button type="submit" id="submit-btn" class="flex-1 px-4 py-2.5 rounded-xl font-medium text-white bg-indigo-600 hover:bg-indigo-700 transition shadow-sm">
            신청 등록
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- 예약 상세/삭제 모달 -->
  <div id="detail-modal" class="fixed inset-0 z-50 hidden bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-xl max-w-sm w-full overflow-hidden p-5 md:p-6 space-y-4">
      <div class="flex items-center justify-between border-b pb-3 border-slate-100">
        <h3 class="font-bold text-slate-800">장소 사용 상세 정보</h3>
        <button id="close-detail-btn" class="text-slate-400 hover:text-slate-600 text-lg">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <div id="detail-content" class="space-y-2 text-sm text-slate-600"></div>

      <!-- 일반 사용자 취소 영역 -->
      <div id="user-delete-area" class="pt-2 space-y-2">
        <input type="password" id="delete-password" maxlength="4" placeholder="등록 시 입력한 비밀번호 4자리" class="w-full px-3 py-2 rounded-xl border border-slate-200 text-xs focus:outline-none focus:ring-2 focus:ring-rose-500/20 focus:border-rose-500" />
        <button id="delete-reservation-btn" class="w-full px-4 py-2.5 rounded-xl font-medium text-rose-600 bg-rose-50 hover:bg-rose-100 transition text-sm">
          예약 취소(삭제)
        </button>
      </div>

      <!-- 관리자 전용 즉시 강제 취소 영역 -->
      <div id="admin-delete-area" class="hidden pt-2">
        <button id="admin-force-delete-btn" class="w-full px-4 py-2.5 rounded-xl font-medium text-white bg-rose-600 hover:bg-rose-700 transition text-sm flex items-center justify-center gap-1.5 shadow-sm">
          <i class="fa-solid fa-trash-can"></i> [관리자 권한] 즉시 강제 삭제
        </button>
      </div>
    </div>
  </div>

  <script>
    // ==========================================
    // [관리자 비밀번호 설정] 여기서 원하는 암호로 수정 가능합니다.
    // ==========================================
    const ADMIN_PASSWORD = "1234";

    // Firebase 설정
    const firebaseConfig = {
      apiKey: "AIzaSyC2IJuF-o9TjlToGimzjPTAlXMQ_gUuQ3U",
      authDomain: "place-80b5e.firebaseapp.com",
      projectId: "place-80b5e",
      storageBucket: "place-80b5e.firebasestorage.app",
      messagingSenderId: "1064681274530",
      appId: "1:1064681274530:web:82abefd328f42635c9abfb",
      measurementId: "G-NW88H18HCX"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    const ROOMS = [
      { id: 'room_01', name: '본당 대예배실', shortName: '본당', location: '본관 2-3층', capacity: '500명' },
      { id: 'room_02', name: '비전홀 (소예배실)', shortName: '비전홀', location: '본관 B1층', capacity: '150명' },
      { id: 'room_03', name: '글로리아홀', shortName: '글로리아', location: '교육관 2층', capacity: '100명' },
      { id: 'room_04', name: '청년부실', shortName: '청년부실', location: '교육관 3층', capacity: '70명' },
      { id: 'room_05', name: '중고등부실', shortName: '중고등부', location: '교육관 4층', capacity: '50명' },
      { id: 'room_06', name: '유초등부실', shortName: '유초등부', location: '교육관 1층', capacity: '40명' },
      { id: 'room_07', name: '유치·영아부실', shortName: '유치부실', location: '본관 1층', capacity: '30명' },
      { id: 'room_08', name: '제1세미나실 (101호)', shortName: '101호', location: '본관 1층', capacity: '25명' },
      { id: 'room_09', name: '제2세미나실 (102호)', shortName: '102호', location: '본관 1층', capacity: '20명' },
      { id: 'room_10', name: '소그룹실 A (201호)', shortName: '201호(A)', location: '교육관 2층', capacity: '12명' },
      { id: 'room_11', name: '소그룹실 B (202호)', shortName: '202호(B)', location: '교육관 2층', capacity: '12명' },
      { id: 'room_12', name: '소그룹실 C (203호)', shortName: '203호(C)', location: '교육관 2층', capacity: '10명' },
      { id: 'room_13', name: '찬양대 연습실', shortName: '찬양대실', location: '본관 B1층', capacity: '60명' },
      { id: 'room_14', name: '찬양팀 합주실', shortName: '합주실', location: '교육관 B1층', capacity: '15명' },
      { id: 'room_15', name: '친교실 / 카페', shortName: '카페테리아', location: '본관 1층', capacity: '80명' }
    ];

    const START_HOUR = 7;
    const END_HOUR = 22;

    const formatDate = (date) => {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    };

    const todayObj = new Date();
    const minDateStr = formatDate(todayObj);

    const maxDateObj = new Date();
    maxDateObj.setMonth(maxDateObj.getMonth() + 6);
    const maxDateStr = formatDate(maxDateObj);

    let currentDate = minDateStr;
    let selectedSlot = null;
    let selectedReservation = null;
    let reservations = [];
    let isAdmin = false;

    // DOM 요소
    const dateInput = document.getElementById('current-date-input');
    const prevDateBtn = document.getElementById('prev-date-btn');
    const nextDateBtn = document.getElementById('next-date-btn');
    const todayBtn = document.getElementById('today-btn');
    const scheduleBody = document.getElementById('schedule-body');
    const timeHeaderRow = document.getElementById('time-header-row');

    dateInput.min = minDateStr;
    dateInput.max = maxDateStr;

    const adminToggleBtn = document.getElementById('admin-toggle-btn');
    const adminBtnText = document.getElementById('admin-btn-text');
    const adminBadge = document.getElementById('admin-badge');
    const adminLoginModal = document.getElementById('admin-login-modal');
    const closeAdminLoginBtn = document.getElementById('close-admin-login-btn');
    const adminLoginForm = document.getElementById('admin-login-form');
    const adminPwdInput = document.getElementById('admin-pwd-input');

    const bookingModal = document.getElementById('booking-modal');
    const closeModalBtn = document.getElementById('close-modal-btn');
    const cancelBookingBtn = document.getElementById('cancel-booking-btn');
    const bookingForm = document.getElementById('booking-form');
    const submitBtn = document.getElementById('submit-btn');

    const detailModal = document.getElementById('detail-modal');
    const closeDetailBtn = document.getElementById('close-detail-btn');
    const detailContent = document.getElementById('detail-content');
    const deletePasswordInput = document.getElementById('delete-password');
    const deleteReservationBtn = document.getElementById('delete-reservation-btn');
    const userDeleteArea = document.getElementById('user-delete-area');
    const adminDeleteArea = document.getElementById('admin-delete-area');
    const adminForceDeleteBtn = document.getElementById('admin-force-delete-btn');

    // 시간 헤더
    const renderHeader = () => {
      let headersHtml = '<div class="flex">';
      for (let h = START_HOUR; h < END_HOUR; h++) {
        const timeLabel = `${String(h).padStart(2, '0')}:00`;
        headersHtml += `
          <div class="w-20 md:w-24 flex-shrink-0 text-center py-2.5 md:py-3 border-r border-slate-200 text-[10px] md:text-[11px] font-semibold text-slate-500">
            ${timeLabel}
          </div>`;
      }
      headersHtml += '</div>';
      timeHeaderRow.innerHTML = headersHtml;
    };

    const updateNavButtons = () => {
      prevDateBtn.disabled = (currentDate <= minDateStr);
      nextDateBtn.disabled = (currentDate >= maxDateStr);
    };

    // 타임테이블 렌더링
    const renderSchedule = () => {
      dateInput.value = currentDate;
      updateNavButtons();
      scheduleBody.innerHTML = '';

      ROOMS.forEach(room => {
        const tr = document.createElement('tr');
        tr.className = 'hover:bg-slate-50/60 transition';

        let rowHtml = `
          <td class="p-2 md:p-3.5 sticky left-0 bg-white z-10 border-r border-slate-200 shadow-[2px_0_6px_rgba(0,0,0,0.02)] w-[120px] md:w-72">
            <div class="font-bold text-slate-800 text-[12px] md:text-[13px] truncate" title="${room.name}">
              <span class="md:hidden">${room.shortName}</span>
              <span class="hidden md:inline">${room.name}</span>
            </div>
            <div class="text-[10px] md:text-[11px] text-slate-400 mt-0.5 truncate">
              <span class="md:hidden">${room.location}</span>
              <div class="hidden md:flex items-center gap-1.5">
                <span>${room.location}</span>
                <span class="text-slate-300">|</span>
                <span>수용: ${room.capacity}</span>
              </div>
            </div>
          </td>
          <td class="p-0">
            <div class="flex">
        `;

        for (let h = START_HOUR; h < END_HOUR; h++) {
          const res = reservations.find(r => r.date === currentDate && r.roomId === room.id && Number(r.hour) === h);

          if (res) {
            rowHtml += `
              <div class="w-20 md:w-24 h-14 md:h-16 flex-shrink-0 p-1 border-r border-slate-100">
                <button onclick="openDetailModal('${res.id}')" class="w-full h-full bg-indigo-50 border border-indigo-200 rounded-lg md:rounded-xl p-1 md:p-1.5 flex flex-col justify-between text-left hover:bg-indigo-100 hover:border-indigo-300 transition shadow-xs">
                  <span class="text-[10px] md:text-[11px] font-bold text-indigo-950 truncate leading-tight">${res.groupName}</span>
                  <span class="text-[9px] md:text-[10px] font-medium text-indigo-600 truncate">${res.applicantName}</span>
                </button>
              </div>
            `;
          } else {
            rowHtml += `
              <div class="w-20 md:w-24 h-14 md:h-16 flex-shrink-0 p-1 border-r border-slate-100">
                <button onclick="openBookingModal('${room.id}', '${room.name}', ${h})" class="w-full h-full border border-dashed border-slate-200 rounded-lg md:rounded-xl flex items-center justify-center text-slate-300 hover:text-indigo-600 hover:border-indigo-300 hover:bg-indigo-50/40 transition group">
                  <i class="fa-solid fa-plus text-[10px] md:text-xs group-hover:scale-125 transition-transform"></i>
                </button>
              </div>
            `;
          }
        }

        rowHtml += `
            </div>
          </td>
        `;
        tr.innerHTML = rowHtml;
        scheduleBody.appendChild(tr);
      });
    };

    // 실시간 Firestore 구독
    db.collection('reservations').onSnapshot((snapshot) => {
      reservations = [];
      snapshot.forEach(doc => {
        reservations.push({ id: doc.id, ...doc.data() });
      });
      renderSchedule();
    }, (error) => {
      console.error("실시간 동기화 오류:", error);
    });

    // 관리자 모드 토글
    adminToggleBtn.addEventListener('click', () => {
      if (isAdmin) {
        if (confirm('관리자 모드를 로그아웃 하시겠습니까?')) {
          isAdmin = false;
          adminBadge.classList.add('hidden');
          adminBtnText.textContent = '관리자 로그인';
          adminToggleBtn.classList.remove('bg-rose-50', 'text-rose-600', 'border-rose-200');
        }
      } else {
        adminPwdInput.value = '';
        adminLoginModal.classList.remove('hidden');
      }
    });

    closeAdminLoginBtn.addEventListener('click', () => {
      adminLoginModal.classList.add('hidden');
    });

    adminLoginForm.addEventListener('submit', (e) => {
      e.preventDefault();
      if (adminPwdInput.value === ADMIN_PASSWORD) {
        isAdmin = true;
        adminBadge.classList.remove('hidden');
        adminBtnText.textContent = '관리자 로그아웃';
        adminToggleBtn.classList.add('bg-rose-50', 'text-rose-600', 'border-rose-200');
        adminLoginModal.classList.add('hidden');
        alert('관리자 모드로 로그인되었습니다. 모든 일정을 비밀번호 없이 관리할 수 있습니다.');
      } else {
        alert('관리자 비밀번호가 일치하지 않습니다.');
      }
    });

    // 모달 인터랙션
    window.openBookingModal = (roomId, roomName, hour) => {
      selectedSlot = { roomId, hour, date: currentDate };
      document.getElementById('modal-date-text').textContent = currentDate;
      document.getElementById('modal-room-text').textContent = roomName;
      document.getElementById('modal-time-text').textContent = `${String(hour).padStart(2, '0')}:00 ~ ${String(hour + 1).padStart(2, '0')}:00`;

      bookingForm.reset();
      submitBtn.disabled = false;
      submitBtn.textContent = '신청 등록';
      bookingModal.classList.remove('hidden');
    };

    const closeBookingModal = () => {
      bookingModal.classList.add('hidden');
      selectedSlot = null;
    };

    window.openDetailModal = (resId) => {
      selectedReservation = reservations.find(r => r.id === resId);
      if (!selectedReservation) return;

      const room = ROOMS.find(r => r.id === selectedReservation.roomId);
      deletePasswordInput.value = '';

      detailContent.innerHTML = `
        <div class="p-3.5 bg-slate-50 rounded-xl space-y-1.5 text-xs">
          <div><span class="font-semibold text-slate-500">장소:</span> <span class="font-bold text-slate-800">${room ? room.name : ''}</span></div>
          <div><span class="font-semibold text-slate-500">일시:</span> ${selectedReservation.date} (${String(selectedReservation.hour).padStart(2, '0')}:00 ~ ${String(Number(selectedReservation.hour) + 1).padStart(2, '0')}:00)</div>
          <div><span class="font-semibold text-slate-500">소속:</span> ${selectedReservation.groupName}</div>
          <div><span class="font-semibold text-slate-500">신청자:</span> ${selectedReservation.applicantName}</div>
          ${selectedReservation.contact ? `<div><span class="font-semibold text-slate-500">비고:</span> ${selectedReservation.contact}</div>` : ''}
        </div>
      `;

      if (isAdmin) {
        userDeleteArea.classList.add('hidden');
        adminDeleteArea.classList.remove('hidden');
      } else {
        userDeleteArea.classList.remove('hidden');
        adminDeleteArea.classList.add('hidden');
      }

      detailModal.classList.remove('hidden');
    };

    const closeDetailModal = () => {
      detailModal.classList.add('hidden');
      selectedReservation = null;
    };

    // 날짜 변경 이벤트
    dateInput.addEventListener('change', (e) => {
      let val = e.target.value;
      if (val < minDateStr) val = minDateStr;
      if (val > maxDateStr) val = maxDateStr;
      currentDate = val;
      renderSchedule();
    });

    prevDateBtn.addEventListener('click', () => {
      const d = new Date(currentDate);
      d.setDate(d.getDate() - 1);
      const newDateStr = formatDate(d);
      if (newDateStr >= minDateStr) {
        currentDate = newDateStr;
        renderSchedule();
      }
    });

    nextDateBtn.addEventListener('click', () => {
      const d = new Date(currentDate);
      d.setDate(d.getDate() + 1);
      const newDateStr = formatDate(d);
      if (newDateStr <= maxDateStr) {
        currentDate = newDateStr;
        renderSchedule();
      }
    });

    todayBtn.addEventListener('click', () => {
      currentDate = minDateStr;
      renderSchedule();
    });

    closeModalBtn.addEventListener('click', closeBookingModal);
    cancelBookingBtn.addEventListener('click', closeBookingModal);
    closeDetailBtn.addEventListener('click', closeDetailModal);

    // 예약 등록
    bookingForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!selectedSlot) return;

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-1"></i> 저장 중...';

      const groupName = document.getElementById('group-name').value.trim();
      const applicantName = document.getElementById('applicant-name').value.trim();
      const password = document.getElementById('password').value.trim();
      const contact = document.getElementById('contact-info').value.trim();

      try {
        await db.collection('reservations').add({
          date: selectedSlot.date,
          roomId: selectedSlot.roomId,
          hour: Number(selectedSlot.hour),
          groupName,
          applicantName,
          password,
          contact,
          createdAt: new Date().toISOString()
        });

        closeBookingModal();
      } catch (err) {
        alert('예약 저장 중 오류가 발생했습니다: ' + err.message);
        submitBtn.disabled = false;
        submitBtn.textContent = '신청 등록';
      }
    });

    // 일반 사용자 예약 취소
    deleteReservationBtn.addEventListener('click', async () => {
      if (!selectedReservation) return;

      const inputPwd = deletePasswordInput.value.trim();
      if (!inputPwd) {
        alert('비밀번호를 입력해 주세요.');
        return;
      }

      if (selectedReservation.password && selectedReservation.password !== inputPwd) {
        alert('비밀번호가 일치하지 않습니다.');
        return;
      }

      if (confirm('이 사역장소 신청을 취소하시겠습니까?')) {
        try {
          await db.collection('reservations').doc(selectedReservation.id).delete();
          closeDetailModal();
        } catch (err) {
          alert('취소 처리 중 오류가 발생했습니다: ' + err.message);
        }
      }
    });

    // 관리자 즉시 강제 삭제
    adminForceDeleteBtn.addEventListener('click', async () => {
      if (!selectedReservation) return;

      if (confirm('[관리자 권한] 해당 예약을 비밀번호 없이 즉시 강제 취소(삭제)하시겠습니까?')) {
        try {
          await db.collection('reservations').doc(selectedReservation.id).delete();
          closeDetailModal();
        } catch (err) {
          alert('관리자 강제 삭제 중 오류가 발생했습니다: ' + err.message);
        }
      }
    });

    // 초기 실행
    renderHeader();
    renderSchedule();
  </script>
</body>
</html>
